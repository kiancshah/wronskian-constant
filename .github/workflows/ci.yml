name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the solvers
        run: make

      - name: Compare both solvers against the reference and the stored values
        run: python3 verify.py 10

      - name: Build and check tn-parity
        run: |
          make -C tn-parity
          make -C tn-parity check

      - name: Check the operator identity symbolically
        run: |
          pip install --quiet sympy
          python3 identity_check.py 2
